<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login page</title>

  <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="login.css">

  <!-- Google -->
  <!-- Speed up connection to Google -->
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://apis.google.com">
<link rel="dns-prefetch" href="//accounts.google.com">
<link rel="dns-prefetch" href="//apis.google.com">

<!-- Google -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <!-- Intro -->
  <div id="intro">
    <div class="glass-word">Hello</div>
  </div>

  <!-- Ambient lights -->
  <div class="background">
    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>
    <div class="light light4"></div>
  </div>

  <!-- Login card -->
  <div class="login-card">
    <h1>Welcome</h1>

    <p id="loginStatus">Sign in with Google to continue</p>

    <button id="loginBtn">Continue with Google</button>
  </div>

    <!-- changing name to Login.js -->
  <script src="Login.js" defer></script>

</body>
</html>
