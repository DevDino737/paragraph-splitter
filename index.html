<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragraph Splitter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    <div class="logo">Paragraph Splitter</div>
  </div>

  <div class="nav-right">
    <div class="dropdown">
      <button id="menuBtn" class="dropbtn">
        Menu ▾
      </button>

      <div id="dropdownMenu" class="dropdown-content">

        <div class="menu-item">
          <span>Show Split Text</span>

          <label class="switch">
            <input
              type="checkbox"
              id="toggleSplit"
              checked
            >
            <span class="slider"></span>
          </label>
        </div>

        <div class="menu-item">
          <span>Show Stream</span>

          <label class="switch">
            <input
              type="checkbox"
              id="toggleStream"
              checked
            >
            <span class="slider"></span>
          </label>
        </div>

        <!--
          NEW: Show Chat toggle.
          This is separate from "Show Stream" on purpose - "Show Stream" (toggleStream)
          keeps controlling the whole youtube-section exactly like before, so nothing
          that already depends on it breaks. This new checkbox only hides/shows the
          chatFrame iframe, which main.js never touches, so it's safe to add here and
          wire up from a separate script (Js/layout.js).
        -->
        <div class="menu-item">
          <span>Show Chat</span>

          <label class="switch">
            <input
              type="checkbox"
              id="toggleChat"
              checked
            >
            <span class="slider"></span>
          </label>
        </div>

        <hr>

        <!--
          NEW: Layout switcher.
          Plain buttons with a data-layout attribute. Js/layout.js reads that attribute
          and swaps a class on #workspace (layout-default / layout-side / layout-compact).
          All the actual positioning is done in CSS via grid-template-areas, so this
          script never has to move any element around in the DOM.
        -->
        <div class="menu-item menu-item-column">
          <span>Layout</span>

          <div class="layout-switcher" role="group" aria-label="Workspace layout">
            <button type="button" class="layout-btn" data-layout="default">Default</button>
            <button type="button" class="layout-btn" data-layout="side">Side-by-Side</button>
            <button type="button" class="layout-btn" data-layout="compact">Compact</button>
          </div>
        </div>

        <hr>

        <input
          type="text"
          id="navbarUrlInput"
          placeholder="YouTube URL..."
        >

      </div>
    </div>
  </div>
</nav>

<!-- ================= HEADER ================= -->
<header id="appHeader">

  <h1>Paragraph Splitter</h1>

  <div id="header-right">
    <img
      id="profilePic"
      class="profile-pic"
      src=""
      alt="Profile"
      hidden
    >
  </div>

</header>

<!--
  ================= WORKSPACE =================
  NEW wrapper element. This is the only structural addition needed to support multiple
  layouts: #workspace becomes a CSS grid, and its three children (.workspace-input,
  #split-results, #youtube-section) are placed into named grid areas. Switching layouts
  is just adding/removing a class here (layout-default / layout-side / layout-compact) -
  see Js/layout.js. No existing IDs were renamed and no elements were moved into a
  different parent/child relationship relative to each other, so main.js keeps working
  unchanged.
-->
<main id="workspace" class="layout-default">

  <!--
    NEW wrapper: groups the textarea and its action button together so they can be
    placed as a single grid area ("input"). The textarea-container div and its contents
    are untouched.
  -->
  <div class="workspace-input">

    <!-- ================= INPUT ================= -->
    <div class="textarea-container">

      <textarea
        id="paragraphInput"
        placeholder="Paste your paragraph here..."
      ></textarea>

    </div>

    <div id="split-actions">
      <button id="splitButton">
        Split Paragraph
      </button>
    </div>

  </div>

  <!-- ================= SPLIT RESULTS ================= -->
  <section id="split-results">

    <h2>Split Text</h2>

    <div id="output"></div>

  </section>

  <!-- ================= YOUTUBE ================= -->
  <section id="youtube-section">

    <div id="stream-control">

      <button id="loadStreamBtn">
        Load Stream
      </button>

      <button id="sendAllBtn">
        Send All To Chat
      </button>

    </div>

    <!-- Sending Status -->
    <div
      id="youtubeSendingIndicator"
      hidden
    >
      <span id="youtubeSendingText">
        Sending to YouTube...
      </span>
    </div>

    <div id="stream-frames">

      <iframe
        id="videoFrame"
        allowfullscreen
      ></iframe>

      <iframe
        id="chatFrame"
      ></iframe>

    </div>

  </section>

</main>

<!-- ================= SELECTION TOOLBAR ================= -->
<div
  id="selectionToolbar"
  hidden
>

  <button data-action="send">
    Send
  </button>

</div>

<!-- ================= TOAST ================= -->
<div
  id="toast"
  hidden
></div>

<script type="module" src="./Js/main.js"></script>
<script type="module" src="./Js/layout.js"></script>

</body>
</html>
