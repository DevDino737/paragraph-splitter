<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragraph Splitter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    <div class="logo">Paragraph Splitter</div>
  </div>

  <div class="nav-right">
    <div class="dropdown">
      <button id="menuBtn" class="dropbtn">
        Menu ▾
      </button>

      <div id="dropdownMenu" class="dropdown-content">

        <div class="menu-item">
          <span>Show Split Text</span>

          <label class="switch">
            <input
              type="checkbox"
              id="toggleSplit"
              checked
            >
            <span class="slider"></span>
          </label>
        </div>

        <div class="menu-item">
          <span>Show Stream</span>

          <label class="switch">
            <input
              type="checkbox"
              id="toggleStream"
              checked
            >
            <span class="slider"></span>
          </label>
        </div>

        <hr>

        <input
          type="text"
          id="navbarUrlInput"
          placeholder="YouTube URL..."
        >

      </div>
    </div>
  </div>
</nav>

<!-- ================= HEADER ================= -->
<header id="appHeader">

  <h1>Paragraph Splitter</h1>

  <div id="header-right">
    <img
      id="profilePic"
      class="profile-pic"
      src=""
      alt="Profile"
      hidden
    >
  </div>

</header>

<!-- ================= INPUT ================= -->
<div class="textarea-container">

  <textarea
    id="paragraphInput"
    placeholder="Paste your paragraph here..."
  ></textarea>

</div>

<div id="split-actions">
  <button id="splitButton">
    Split Paragraph
  </button>
</div>

<!-- ================= SPLIT RESULTS ================= -->
<section id="split-results">

  <h2>Split Text</h2>

  <div id="output"></div>

</section>

<!-- ================= YOUTUBE ================= -->
<section id="youtube-section">

  <div id="stream-control">

    <button id="loadStreamBtn">
      Load Stream
    </button>

    <button id="sendAllBtn">
      Send All To Chat
    </button>

  </div>

  <!-- Sending Status -->
  <div
    id="youtubeSendingIndicator"
    hidden
  >
    <span id="youtubeSendingText">
      Sending to YouTube...
    </span>
  </div>

  <div id="stream-frames">

    <iframe
      id="videoFrame"
      allowfullscreen
    ></iframe>

    <iframe
      id="chatFrame"
    ></iframe>

  </div>

</section>

<!-- ================= SELECTION TOOLBAR ================= -->
<div
  id="selectionToolbar"
  hidden
>

  <button data-action="send">
    Send
  </button>

</div>

<!-- ================= TOAST ================= -->
<div
  id="toast"
  hidden
></div>

<script type="module" src="./Js/main.js"></script>

</body>
</html>
